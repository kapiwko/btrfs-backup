name: systemd security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-service:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            cmake \
            gcc \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze service sandbox
        run: |
          cmake --preset gcc-debug -DBTRFSBACKUP_ARCHITECTURE_TESTS=OFF
          ctest --preset gcc-debug -L systemd --parallel "$(nproc)"
