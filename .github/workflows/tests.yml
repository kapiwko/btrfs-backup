name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            make \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check C++ formatting
        run: make check-format
        env:
          CPP_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  clang-tidy:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run C++ static analysis
        run: |
          cmake --preset clang-tidy
          cmake --build --preset clang-tidy --parallel "$(nproc)"

  compiler-tests:
    name: ${{ matrix.compiler }} tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            preset: gcc-debug
          - compiler: Clang
            preset: clang-debug
          - compiler: GCC (manager disabled)
            preset: gcc-manager-disabled
          - compiler: Clang (manager disabled)
            preset: clang-manager-disabled
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-
      - name: Run test suite
        run: |
          cmake \
            --preset "${{ matrix.preset }}" \
            -DBTRFSBACKUP_ARCHITECTURE_TESTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset "${{ matrix.preset }}" --parallel "$(nproc)"
          ctest --preset "${{ matrix.preset }}" --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

  architecture-tests:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-architecture-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-architecture-
      - name: Configure architecture tests
        run: cmake --preset architecture -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Run architecture tests
        run: ctest --preset architecture --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

  kde-dbus-contract:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            cmake \
            extra-cmake-modules \
            git \
            kcmutils \
            kcoreaddons \
            ki18n \
            kirigami \
            kio \
            kjobwidgets \
            knotifications \
            kpackage \
            krunner \
            kwidgetsaddons \
            libplasma \
            ninja \
            nlohmann-json \
            pkgconf \
            qt6-base \
            qt6-declarative \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-kde-dbus-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-kde-dbus-
      - name: Configure KDE D-Bus contract build
        run: cmake --preset kde-debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Build KDE integration and tests
        run: |
          cmake \
            --build --preset kde-debug \
            --target \
              btrfs-backup-kde \
              btrfs-backup-kde-tests \
              btrfs-backupd \
              btrfsbackup-dbus-manager-tests \
              btrfsbackup-fake-polkit-authority \
            --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Verify server and KDE D-Bus contracts
        run: |
          ctest --test-dir build/kde-debug -R '^(manager-dbus-contract|dbus-manager-tests)$' --output-on-failure
          ctest --preset kde --parallel "$(nproc)"

  sanitizers:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-sanitizers-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-sanitizers-
      - name: Configure ASan and UBSan
        run: cmake --preset asan-ubsan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build with sanitizers
        run: cmake --build --preset asan-ubsan --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Run tests with sanitizers
        run: ctest --preset asan-ubsan --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

  fuzz-smoke:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fuzz targets
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz --parallel "$(nproc)"
      - name: Run seeded fuzz smoke tests
        run: ctest --preset fuzz --parallel 2

  strict-warnings:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-strict-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-strict-
      - name: Configure strict warnings
        run: cmake --preset strict-warnings -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build with strict warnings
        run: cmake --build --preset strict-warnings --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
