name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            git \
            make
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check C++ formatting
        run: make check-format
        env:
          CPP_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  clang-tidy:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@v4
      - name: Run C++ static analysis
        run: make clang-tidy

  compiler-tests:
    name: ${{ matrix.compiler }} tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@v4
      - name: Run test suite
        run: ./tests/run-tests.sh
        env:
          CXX: ${{ matrix.cxx }}

  sanitizers:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: |
          cmake \
            -S . \
            -B build/sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build with sanitizers
        run: cmake --build build/sanitizers --parallel "$(nproc)"
      - name: Run tests with sanitizers
        run: ctest --test-dir build/sanitizers --parallel "$(nproc)" --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  strict-warnings:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@v4
      - name: Configure strict warnings
        run: |
          cmake \
            -S . \
            -B build/strict-warnings \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-Werror -Wconversion -Wsign-conversion -Wshadow"
      - name: Build with strict warnings
        run: cmake --build build/strict-warnings --parallel "$(nproc)"
