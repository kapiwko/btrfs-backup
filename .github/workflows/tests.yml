name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            git \
            make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check C++ formatting
        run: make check-format
        env:
          CPP_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  clang-tidy:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            clang \
            cmake \
            git \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run C++ static analysis
        run: make clang-tidy

  compiler-tests:
    name: ${{ matrix.compiler }} tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-
      - name: Run test suite
        run: ./tests/run-tests.sh
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CMAKE_CONFIGURE_ARGS: -G Ninja -DBTRFSBACKUP_ARCHITECTURE_TESTS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          CXX: ${{ matrix.cxx }}

  architecture-tests:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-architecture-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-architecture-
      - name: Configure architecture tests
        run: |
          cmake \
            -S . \
            -B build/architecture \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Run architecture tests
        run: ctest --test-dir build/architecture -L architecture --parallel "$(nproc)" --output-on-failure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

  sanitizers:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-sanitizers-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-sanitizers-
      - name: Configure ASan and UBSan
        run: |
          cmake \
            -S . \
            -B build/sanitizers \
            -G Ninja \
            -DBTRFSBACKUP_ARCHITECTURE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build with sanitizers
        run: cmake --build build/sanitizers --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Run tests with sanitizers
        run: ctest --test-dir build/sanitizers --parallel "$(nproc)" --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  strict-warnings:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            ccache \
            clang \
            cmake \
            git \
            ninja \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-strict-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-strict-
      - name: Configure strict warnings
        run: |
          cmake \
            -S . \
            -B build/strict-warnings \
            -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-Werror -Wconversion -Wsign-conversion -Wshadow"
      - name: Build with strict warnings
        run: cmake --build build/strict-warnings --parallel "$(nproc)"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
