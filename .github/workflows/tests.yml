name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            nlohmann-json3-dev \
            libmount-dev \
            libudev-dev \
            libbtrfsutil-dev
      - name: Run test suite
        run: ./tests/run-tests.sh
