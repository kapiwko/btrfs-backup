name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed \
            btrfs-progs \
            cmake \
            git \
            nlohmann-json \
            pkgconf \
            systemd \
            util-linux
      - uses: actions/checkout@v4
      - name: Run test suite
        run: ./tests/run-tests.sh
