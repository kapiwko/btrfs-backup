name: Feature request
description: Propose a scoped capability or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user or operator problem before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the observable workflow, including CLI or configuration changes when relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Architecture and safety
      options:
        - label: The proposal keeps automatic backup independent of KDE and a logged-in user.
          required: true
        - label: The proposal does not require the system manager for udev/systemd backup execution.
          required: true
        - label: I described compatibility, migration, destructive behavior, and recovery implications where applicable.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Link related roadmap, design, issue, or external documentation.
