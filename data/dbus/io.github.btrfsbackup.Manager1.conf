<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.btrfsbackup.Manager1"/>
  </policy>
  <policy context="default">
    <deny own="io.github.btrfsbackup.Manager1"/>
    <deny send_destination="io.github.btrfsbackup.Manager1"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="GetCapabilities"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="ListProfiles"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="GetStatus"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="GetHistorySanitized"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="GetDeviceState"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="StartBackup"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="CancelBackup"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="ValidateTarget"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="EjectTarget"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="GetProfileDetails"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="UpdateProfileSettings"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="AddProfileSource"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="UpdateProfileSource"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="RemoveProfileSource"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="DeleteProfile"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="SetProfileEnabled"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="OpenBrowseSession"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="CloseBrowseSession"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="ResolveBackupCoverage"/>
    <allow receive_sender="io.github.btrfsbackup.Manager1"
           receive_interface="io.github.btrfsbackup.Manager1"/>
  </policy>
</busconfig>
