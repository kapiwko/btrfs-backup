           send_interface="io.github.btrfsbackup.Manager1"
           send_member="AddTargetPassphrase"/>
    <allow send_destination="io.github.btrfsbackup.Manager1"
           send_interface="io.github.btrfsbackup.Manager1"
           send_member="AddTargetKey"/>
